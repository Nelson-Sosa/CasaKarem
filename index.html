<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logoCasaKarem-removebg-preview.png?v=3" />
    <link rel="apple-touch-icon" href="/logoCasaKarem-removebg-preview.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Casa Karem — Catálogo online de tecnología, celulares, perfumes y accesorios. Productos y soluciones para vos." />
    <meta property="og:title" content="Casa Karem | Catálogo Online" />
    <meta property="og:site_name" content="Casa Karem" />
    <meta property="og:description" content="Catálogo online de tecnología, celulares, perfumes y accesorios. Productos y soluciones para vos." />
    <meta property="og:image" content="/logo-casa-karem-circulo.webp" />
    <title>Casa Karem | Catálogo Online</title>

    <!--
      Preconnect a Cloudinary CDN y Firebase:
      Establece la conexión TCP + TLS antes de que el browser descubra
      las URLs de imagen y datos, ahorrando 100-300ms en la primera carga.
    -->
    <!-- Cloudinary CDN (imágenes de productos) -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    
    <!-- Firebase Firestore (base de datos de productos) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    
    <!-- Firebase Auth (autenticación de usuarios) -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
