<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" fill="none">
  <!-- Background -->
  <rect width="200" height="80" rx="8" fill="#E30613"/>
  
  <!-- Card icon -->
  <rect x="20" y="25" width="40" height="30" rx="3" fill="white" opacity="0.95"/>
  <rect x="22" y="32" width="12" height="2" rx="1" fill="#E30613"/>
  <rect x="22" y="38" width="20" height="2" rx="1" fill="#E30613"/>
  <rect x="22" y="44" width="16" height="2" rx="1" fill="#E30613"/>
  
  <!-- Text -->
  <text x="70" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">
    Dinelco
  </text>
  
  <!-- Chip icon -->
  <rect x="24" y="29" width="8" height="8" rx="1" fill="#FFD700"/>
  <line x1="26" y1="31" x2="26" y2="35" stroke="#E30613" stroke-width="0.5"/>
  <line x1="28" y1="31" x2="28" y2="35" stroke="#E30613" stroke-width="0.5"/>
  <line x1="30" y1="31" x2="30" y2="35" stroke="#E30613" stroke-width="0.5"/>
  
  <!-- Network indicator -->
  <circle cx="175" cy="40" r="8" fill="white" opacity="0.3"/>
  <circle cx="185" cy="40" r="8" fill="white" opacity="0.5"/>
</svg>
